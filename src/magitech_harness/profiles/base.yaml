- id: system-prompt
  name: magitech_harness.system_prompt.service:SystemPromptService
  config: {}
- id: tools
  name: magitech_harness.tools.service:ToolService
  config: {}
- id: tool-executor-native
  name: magitech_harness.tools.native_executor:apply
  config: {}
- id: llm
  name: magitech_harness.llm.service:LLMService
  config: {}
- id: fs
  name: magitech_harness.fs.local:LocalFileSystem
  config: {}
- id: fs-observation-policy
  name: magitech_harness.fs.observation_policy:apply
  config: {}
- id: subprocess
  name: magitech_harness.subprocess.local:LocalSubprocessRuntime
  config: {}
- id: shell-env
  name: magitech_harness.shell_env.service:ShellEnvRegistry
  config: {}
- id: context
  name: magitech_harness.context.service:ContextService
  config: {}
- id: compaction
  name: magitech_harness.compaction.service:CompactionService
  config: {}
- id: tool-result-pruner
  name: magitech_harness.compaction.pruner:apply
  config:
    thresholdChars: 8192
    headChars: 4096
    tailChars: 1024
- id: bash-local
  name: magitech_harness.shell.bash_local:LocalBashExecutor
  disabled_on: [win32]
  config: {}
- id: pwsh-local
  name: magitech_harness.shell.pwsh_local:LocalPwshExecutor
  enabled_on: [win32]
  config: {}
- id: tool-bash
  name: magitech_harness.tools.bash_tool:apply
  disabled_on: [win32]
  config: {}
- id: tool-fs
  name: magitech_harness.tools.fs:apply
  config:
    apply_patch: false
- id: tool-fs-search
  name: magitech_harness.tools.fs_search:apply
  config: {}
- id: jobs
  name: magitech_harness.jobs.local:LocalJobRegistry
  config: {}
- id: working-directory
  name: magitech_harness.session.working_directory:WorkingDirectoryService
  config: {}
- id: approval
  name: magitech_harness.approval.service:ApprovalService
  config:
    policy: ask
- id: approval-guard
  name: magitech_harness.approval.guard:apply
  config: {}
- id: layers
  name: magitech_harness.components.layers:LayerResolutionService
  config: {}
- id: components
  name: magitech_harness.components.service:ComponentService
  config: {}
- id: session-projections
  # The sessions row declares this slot as a required injection, so
  # the row order carries no load semantics here; this listing order
  # is retained as-is.
  name: magitech_harness.session.projection_registry:SessionProjectionRegistry
  config: {}
- id: sessions
  name: magitech_harness.session.service:SessionService
  config:
    base_storage_dir: ${MAGITECH_SESSIONS_DIR}
- id: session-persistence-jsonl
  name: magitech_harness.session.persistence_jsonl:JsonlSessionPersistenceService
  config:
    root: ${MAGITECH_SESSIONS_DIR}
    live_batch_delay: 0.2
- id: projection-title
  name: magitech_harness.session.projections:apply_title_projection
  config: {}
- id: projection-title-input
  name: magitech_harness.session.projections:apply_title_input_projection
  config: {}
- id: projection-session-stats
  name: magitech_harness.session.projections:apply_session_stats_projection
  config: {}
- id: projection-turn-outline
  name: magitech_harness.session.projections:apply_turn_outline_projection
  config: {}
- id: projection-working-directory
  name: magitech_harness.session.projections:apply_working_directory_projection
  config: {}
- id: session-title
  name: magitech_harness.session.title:SessionTitleService
  config:
    fallback_max_words: 5
    fallback_max_bytes: 40
    max_title_bytes: 80
- id: session-title-first-prompt
  name: magitech_harness.session.title_first_prompt:apply
  config:
    target_words: 5
    target_cjk_characters: 10
    max_input_bytes: 4096
    max_output_tokens: 4096
    timeout_ms: 60000
- id: session-checkpoint-policy
  name: magitech_harness.session.checkpoint_policy:apply
  config: {}
- id: session-projection-cache
  name: magitech_harness.session.projection_cache:SessionProjectionCacheService
  config:
    root: ${MAGITECH_SESSIONS_DIR}
    write_every_events: 200
    write_interval_ms: 5000
- id: llm-retry
  name: magitech_harness.llm.retry:apply
  config: {}
- id: token-meter
  name: magitech_harness.llm.token_meter:TokenMeter
  config: {}
- id: agent
  name: magitech_harness.agent.registry:AgentRegistry
  config: {}
- id: agent-default-model
  name: magitech_harness.agent.default_model:AgentDefaultModel
  config:
    provider: kilo
    model: kilo-auto/free
- id: user-questions
  name: magitech_harness.context.user_questions:UserQuestionService
  config: {}
- id: tool-ask-user
  name: magitech_harness.context.user_questions:apply
  config: {}
- id: web
  name: magitech_harness.web.service:apply
  config:
    fetch_timeout_seconds: 30
    search_timeout_ms: 60000
- id: tool-web
  name: magitech_harness.web.tools:apply
  config:
    fetch: true
    searchTimeoutMs: 60000
- id: subagent
  name: magitech_harness.subagent.service:SubagentService
  config:
    maxActiveSubagents: 10
    maxDepth: 1
- id: subagent-spawn-in-process
  name: magitech_harness.subagent.providers:apply_spawn
  config: {}
- id: subagent-fork-in-process
  name: magitech_harness.subagent.providers:apply_fork
  config: {}
- id: tool-subagent
  name: magitech_harness.subagent.tools:apply
  config:
    provider: spawn
    control: false
- id: tool-subagent-fork
  name: magitech_harness.subagent.tools:apply
  config:
    provider: fork
    tool_name: subagent_fork
    control: false
- id: tool-subagent-control
  name: magitech_harness.subagent.tools:apply_control
  config: {}
- id: agent-team
  name: magitech_harness.team.service:TeamService
  config:
    maxTasks: 256
    defaultEnabled: false
- id: tool-agent-team
  name: magitech_harness.team.tools:apply
  config: {}
- id: goals
  name: magitech_harness.goal.service:GoalService
  config:
    defaultMaxGoalRounds: 256
- id: agent-loop
  name: magitech_harness.agent.agent_loop:AgentLoop
  config:
    agents: []
- id: repeat-tool-reminder-guard
  name: magitech_harness.tools.repeat_guard:apply
  config:
    thresholds: [3, 5, 8]
- id: timeout-policy-guard
  name: magitech_harness.tools.timeout_guard:apply
  config: {}
- id: tool-todo
  name: magitech_harness.tools.todo:apply
  config:
    allow_parallel_in_progress: true
- id: tool-jobs
  name: magitech_harness.tools.jobs:apply
  config: {}
- id: tool-goal
  name: magitech_harness.goal.tools:apply
  config:
    blocked_after_consecutive_rounds: 3
