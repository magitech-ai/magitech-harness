[project]
name = "magitech-harness"
version = "0.1.0"
description = "Magitech Harness: Composable Agent Runtime by Magitech"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anima",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
mth = "magitech_harness.cli:main"
magitech = "magitech_harness.cli:main"
magitech-harness = "magitech_harness.cli:main"

[tool.uv.sources]
anima = { path = "../anima", editable = true }

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
